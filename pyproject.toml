[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hanford"
version = "0.1.0"
description = "Life administration agent. Monitors bills, detects anomalies, calls companies on your behalf."
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "textual>=0.47.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "openai>=1.0",
    "anthropic>=0.39",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
    "python-telegram-bot>=20.0",
    "twilio>=8.0",
    "aiohttp>=3.9",
    "requests>=2.31",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.0",
]

[project.scripts]
hanford = "hanford.main:run"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
